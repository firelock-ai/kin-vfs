name: Registry Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  release:
    uses: firelock-ai/kin-actions/.github/workflows/cargo-registry-release.yml@v0.1.11
    with:
      package: kin-vfs-core
      manifest: Cargo.toml
      source-paths: crates/kin-vfs-core Cargo.toml
      registry-build-command: cargo build -p kin-vfs-core
      test-command: cargo test --workspace
      # Flip to true once the release App credentials are available to this repo
      # (KIN_RELEASE_BOT_APP_ID + KIN_RELEASE_BOT_PRIVATE_KEY, ideally org-level).
      # The App installation already covers every repo; only the credentials are
      # missing. Until then the mint step would refuse on every main push, since
      # it will not create a tag it cannot make trigger release.yml.
      mint-release-tag: false
    secrets:
      KINLAB_CARGO_TOKEN: ${{ secrets.KINLAB_CARGO_TOKEN }}
      KIN_CI_BOT_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
      KIN_DOWNSTREAM_DISPATCH_TOKEN: ${{ secrets.KIN_DOWNSTREAM_DISPATCH_TOKEN }}
      KIN_RELEASE_TAG_TOKEN: ${{ secrets.KIN_RELEASE_TAG_TOKEN }}
      KIN_RELEASE_BOT_APP_ID: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
      KIN_RELEASE_BOT_PRIVATE_KEY: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
