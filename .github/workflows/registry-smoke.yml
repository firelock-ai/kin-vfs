# Registry cutover smoke.
#
# kin-vfs-daemon consumes the canonical repository-tree contract from
# kin-model. A fresh public clone must resolve that dependency from Kin's
# registry with no tracked `[patch]`, local path override, or git pin.

name: Registry Cutover Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  registry_cutover_smoke:
    name: Fresh-clone registry-config smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Assert no private patches or external Kin git-pins
        run: |
          set -euo pipefail
          fail=0
          # No [patch] table anywhere in the tree.
          if grep -rnE '^[[:space:]]*\[patch' --include=Cargo.toml .; then
            echo "::error::[patch] table found — remove it or keep dev-only overrides in user-level cargo config, not tracked files."
            fail=1
          fi
          # The tracked config may name the public Kin registry, but it must not
          # carry patches, credentials, or local source replacement.
          if grep -nE '\[patch|token[[:space:]]*=|credential|replace-with|directory[[:space:]]*=' .cargo/config.toml; then
            echo "::error::tracked .cargo/config.toml carries a patch, credential, or local source override."
            fail=1
          fi
          # No dependency git-pinned to a firelock-ai repo (the `git = "..."`
          # form; `repository = "..."` metadata is unaffected).
          if grep -rnE 'git[[:space:]]*=[[:space:]]*"https://github.com/firelock-ai' --include=Cargo.toml .; then
            echo "::error::git-pinned firelock-ai dependency found — cut over to the public registry or justify dev-only use."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: public Kin registry configured with no tracked patches, credentials, local overrides, or git pins."

      - name: Fresh-clone locked build
        # `--locked` proves the committed Cargo.lock resolves with no mutation:
        # a pristine public clone builds as-is, without any private local patch.
        run: cargo build --workspace --locked
