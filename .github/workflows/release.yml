name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable
      - run: cargo test --workspace
      # The mount's CLI surface lives behind a feature flag, so `--workspace`
      # does not compile it. A release that never built it could ship a
      # `kin-vfs` whose mount commands do not exist.
      - name: Test the mount features (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: cargo test -p kin-vfs-cli --features nfs

  release:
    name: Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
