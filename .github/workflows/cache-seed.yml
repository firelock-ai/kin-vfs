name: Cache Seed

# Actions caches written on the default branch are visible to pull-request and
# merge-queue runs. CI deliberately does not repeat its test suite on a push to
# main, so this small workflow owns the one bounded source cache each runner
# OS/architecture restores. It downloads Cargo registry and git sources only.
# Compiled target output is never cached.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Several landings close together need only the newest dependency set.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  seed:
    name: Seed cargo sources (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Preserve every native platform from the former seed. Linux x64 and
      # arm64 use distinct runner.arch keys, so concurrent jobs cannot race to
      # create the same immutable entry.
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore cargo sources
        id: cargo-sources
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-sources-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-sources-

      - name: Fetch dependency sources
        id: fetch_sources
        continue-on-error: true
        run: cargo fetch --locked

      - name: Save cargo sources on main
        if: github.ref == 'refs/heads/main' && steps.cargo-sources.outputs.cache-hit != 'true' && steps.fetch_sources.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}
