name: Dependabot Version Bump

# The shared `release / Version bump gate` (check-version-bump.py in
# kin-actions) treats any Cargo.toml dependency/feature change as
# release-affecting and requires the workspace version to move. Dependabot
# only ever edits a dependency line, never a version field, so every
# dependabot cargo PR fails that gate by construction, and there is no
# exemption for it (nor should there be: a third-party bump is a genuine
# release-affecting change, same as a human one).
#
# This workflow supplies the missing half. For a dependabot PR that touches a
# Cargo.toml, it bumps both release version authorities the SAME way the
# internal dependency wave bumps its own PRs (`bump-own-version.py` from
# kin-actions, see the "Bump own version" step of kin-dependency-wave.yml) and
# resyncs the root Cargo.lock in the same commit, using the wave's own
# resync recipe. The resync half is load-bearing on its own: crates/kin-vfs-fuse
# is excluded from `[workspace] members` (it links macFUSE/FUSE-T off Linux)
# but kin-vfs-cli still reaches it through the optional `fuse` feature, so it
# is resolved into the ROOT Cargo.lock regardless of the exclusion. A
# manifest-only bump leaves that lock entry (and every dependency edge
# dependabot actually changed) stale, and every `--locked` check -- Registry
# Cutover Smoke and both FUSE mount legs -- then fails with "cannot update
# the lock file ... because --locked was passed", which is what happened to
# kin-vfs#93 and #94 before their own, unrelated breakage.
#
# A dependabot-triggered `pull_request` run gets a read-only GITHUB_TOKEN and
# no repository secrets (GitHub's own hardening restriction), so this reacts
# to the completion of the PR's own checks instead, which runs with the
# repository's normal token and secrets regardless of who opened the PR --
# the same `workflow_run` idiom merge-queue-ejection-notice.yml already uses
# here for the same reason.
#
# The push this job makes still cannot use the default GITHUB_TOKEN: GitHub
# never starts a new workflow run from an event a GITHUB_TOKEN-authored push
# would otherwise trigger, specifically to prevent recursive runs (see
# "Triggering a workflow from a workflow" in GitHub's own docs). Pushed with
# GITHUB_TOKEN, the bump commit would sit on the PR with no CI ever run
# against it, so the version-bump gate and every `--locked` check would stay
# red at the OLD head forever and the merge queue could never grade the new
# one. A GitHub App installation token does not carry that restriction, so
# this mints one the same way "Mint repository-scoped release token" in
# kin-dependency-wave.yml does, from the same `KIN_RELEASE_BOT_APP_ID` /
# `KIN_RELEASE_BOT_PRIVATE_KEY` pair, which exists only as a secret scoped to
# the `registry-publish` environment (bound below). That environment's
# deployment branch policy allows `main` only, which a `workflow_run` job
# satisfies by construction: GitHub always resolves `github.ref` for a
# `workflow_run` event to the repository's default branch, never to the
# triggering PR's ref.
#
# Re-triggering after the push is bounded, not open-ended: `bump-own-version.py`
# computes its target from the base branch and no-ops once the branch already
# carries it, so the CI run this push starts finds nothing left to change on
# its own next pass through this workflow.
#
# A human PR gets none of this -- the trigger only matches a dependabot
# branch name -- and the gate keeps refusing an un-bumped release-affecting
# change exactly as before.
on:
  workflow_run:
    workflows: ["CI", "PR Text Hygiene", "Registry Publish", "Registry Cutover Smoke", "SAST"]
    types: [completed]
  # THROWAWAY diagnostic input, added to investigate why the bump job's push
  # (App token, contents:write only) lands the commit but never starts a new
  # CI run on it. Drives the `probe` job below only; remove both once the
  # investigation concludes. `workflow_dispatch` needs the workflow file
  # present on the default branch to be dispatchable at all, which is the
  # whole reason this rides the already-merged file instead of a separate one.
  workflow_dispatch:
    inputs:
      probe_pr:
        description: "PR number to close/reopen with a pull-requests:write App token, to test whether that starts a new CI run"
        required: true
        type: string

# The five workflows above can all complete within moments of each other for
# the same dependabot PR, and each completion is a separate workflow_run
# event, so without this every one of them would start its own copy of this
# job against the same branch. Keyed on the head branch, not the run id, so
# concurrent copies for the SAME branch serialize instead of racing two
# pushes; queued rather than cancelled, because a cancelled copy could still
# have partially applied a bump before it died, and a queued rerun is safe
# either way since the whole recipe is idempotent.
concurrency:
  group: dependabot-version-bump-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: Bump version and lockfile for a dependabot manifest change
    # Same-repo only (dependabot never forks here) and scoped to the cargo
    # ecosystem branches: dependabot's github-actions updates branch under
    # dependabot/github_actions/ and touch no Cargo.toml, so this workflow
    # simply never matches them.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/cargo/')
    runs-on: ubuntu-latest
    # Unlocks the KIN_RELEASE_BOT_APP_ID / KIN_RELEASE_BOT_PRIVATE_KEY secrets
    # below; both exist only as secrets scoped to this environment. The
    # environment's branch policy allows only `main`, which is exactly what
    # `github.ref` is here (see the header comment on `workflow_run`).
    environment: registry-publish
    steps:
      - name: Mint repository-scoped release token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}
      - uses: actions/checkout@v7
        with:
          repository: firelock-ai/kin-actions
          ref: v0.1.34
          path: .kin-actions
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable

      - name: Check whether a Cargo.toml changed against main
        id: touched
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main -- .)"
          if printf '%s\n' "$changed" | grep -qE '(^|/)Cargo\.toml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no Cargo.toml in the diff against origin/main; nothing for this workflow to do"
          fi

      # Both authorities move together always, regardless of which manifest(s)
      # dependabot actually touched: scripts/check-release-metadata.py requires
      # crates/kin-vfs-fuse's own [package].version to equal the root
      # [workspace.package].version, and the wave keeps them in lockstep the
      # same way (see the "manifests:" comment in kin-dependency-wave.yml).
      - name: Bump both release version authorities
        if: steps.touched.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 .kin-actions/scripts/bump-own-version.py --manifest Cargo.toml --base-ref origin/main
          python3 .kin-actions/scripts/bump-own-version.py --manifest crates/kin-vfs-fuse/Cargo.toml --base-ref origin/main

      - name: Resynchronize Cargo.lock with the bumped versions
        if: steps.touched.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo update --workspace
          else
            echo "Cargo.lock is not tracked; nothing to resynchronize"
          fi

      # The cheap proof the version and the lock moved together: this is
      # exactly the check every `--locked` CI job makes, run here first so a
      # broken resync fails this job loudly instead of pushing a still-broken
      # pair back onto the PR.
      - name: Prove the version and lockfile moved together
        if: steps.touched.outputs.changed == 'true'
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Commit and push the bump if anything moved
        if: steps.touched.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          rm -rf .kin-actions
          if git diff --quiet -- Cargo.toml crates/kin-vfs-fuse/Cargo.toml Cargo.lock; then
            echo "nothing to commit; version and lock already match this manifest change"
            exit 0
          fi
          git add Cargo.toml crates/kin-vfs-fuse/Cargo.toml Cargo.lock
          git commit -s -m "chore(deps): bump kin-vfs-core and kin-vfs-fuse for the dependabot manifest change"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"

  # THROWAWAY diagnostic job, only reachable via the workflow_dispatch input
  # above. Mints a token scoped like the wave's own release token (adds
  # pull-requests:write, which the `bump` job's mint step above does not
  # request) and uses it to close then reopen a PR with no code change, to
  # test whether a pull_request:reopened event starts a new CI run in this
  # repo for an App-token-driven action. Remove this job and the
  # workflow_dispatch trigger once the investigation concludes.
  probe:
    if: github.event_name == 'workflow_dispatch'
    name: Diagnostic - close/reopen with a pull-requests:write token
    runs-on: ubuntu-latest
    environment: registry-publish
    steps:
      - name: Mint token with pull-requests write
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Close and reopen the PR with that token
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          PR: ${{ inputs.probe_pr }}
        run: |
          set -euo pipefail
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY"
          sleep 3
          gh pr reopen "$PR" --repo "$GITHUB_REPOSITORY"
          echo "closed and reopened PR $PR"
